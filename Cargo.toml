[package]
name = "resh"
version = "0.1.0"
edition = "2024"
description = "A readable shell: typed, anyfix commands and wrappers for existing CLI tools"
repository = "https://github.com/wongjiahau/resh"
homepage = "https://github.com/wongjiahau/resh"
readme = "README.md"
keywords = ["shell", "cli", "language"]
categories = ["command-line-utilities"]

[dependencies]
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }
